# v3 HIGH band: rebalanced distribution targets.
#
# Problems fixed vs v2:
#   1) macro:pass was gamed: the 5 Hz corrector re-issues PASS_THROUGH every
#      5 Hz tick even on straight flights, so macro:total / macro:pass filled
#      the coverage while almost no task needed a real correction.
#   2) No task-level guarantee that N tasks actually trigger NORMAL/TURN.
#
# Changes:
#   * macro:pass demoted to soft (no longer gates generation_ok).
#   * Hard floors raised on real corrections (normal / turn / corr_angle).
#   * NEW task-level behavior:<class> targets (C++ behavior metric) force a
#     minimum number of tasks whose preflight used turn_left / turn_right /
#     turn_both / turn_normal / long_takeover / normal.
#   * Scenes slightly denser (surface gap 1.6 -> 1.3) so the straight line is
#     more often blocked -> upper-level takeover is genuinely required.
extends: /home/rgzn/flightmare_ws/src/il_dataset/config/il_dataset_outdoor_config.yaml
global:
  output_dir: "/home/rgzn/flightmare_ws/il_data_d435i_col_high_v3"
  blueprint_generation:
    base_seed: 260830
    # NOTE: blueprint_generation.scene_generation.min_surface_gap_m has a hard
    # floor of 1.40 m (planner-required passage, il_config validation), so the
    # per-level scene_parallel.surface_gap_min_m is the densification lever.
    scene_parallel:
      surface_gap_min_m: 1.30
      # total 160 generated tasks = 16 scenes x 10 tasks (handcrafted half is
      # appended separately; total blueprint = 320).
      expected_collect_tasks: 160
      scenes_per_level_list: [4, 4, 4, 4]
    requirements:
      min_tasks: 120
    distribution_targets:
      # ── 5 Hz macro coverage (decision counts; scaled for 160 tasks) ──
      - {key: "macro:total", metric: "count:macro:total",
         target: 1800, minimum: 1200, weight: 1.0, minimum_hard: false}
      - {key: "macro:pass", metric: "count:macro:pass",
         target: 1500, minimum: 700, weight: 0.5, minimum_hard: false}
      - {key: "macro:normal", metric: "count:macro:normal",
         target: 120, minimum: 80, weight: 2.0, minimum_hard: true}
      - {key: "macro:turn_left", metric: "count:macro:turn_left",
         target: 100, minimum: 65, weight: 5.0, minimum_hard: true}
      - {key: "macro:turn_right", metric: "count:macro:turn_right",
         target: 90, minimum: 60, weight: 5.0, minimum_hard: true}
      - {key: "corr_angle_total", metric: "hist:macro_correction_angle",
         target: 100, minimum: 80, weight: 2.0, minimum_hard: true}
      # ── task-level behaviour coverage (count:behavior:<class>) ──
      - {key: "behavior:turn_left", metric: "count:behavior:turn_left",
         target: 32, minimum: 20, weight: 5.0, minimum_hard: true}
      - {key: "behavior:turn_right", metric: "count:behavior:turn_right",
         target: 26, minimum: 16, weight: 5.0, minimum_hard: true}
      - {key: "behavior:turn_both", metric: "count:behavior:turn_both",
         target: 6, minimum: 3, weight: 4.0, minimum_hard: true}
      - {key: "behavior:turn_normal", metric: "count:behavior:turn_normal",
         target: 3, minimum: 1, weight: 4.0, minimum_hard: true}
      - {key: "behavior:long_takeover", metric: "count:behavior:long_takeover",
         target: 2, minimum: 0, weight: 4.0, minimum_hard: false}
      - {key: "behavior:normal", metric: "count:behavior:normal",
         target: 2, minimum: 0, weight: 3.0, minimum_hard: false}
