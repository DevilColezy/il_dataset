# ============================================================================
#  joint_v2 — production collection recipe for the NEW hierarchical local
#  expert (both il_dataset_collect.launch and
#  il_dataset_joint_v2_collect.launch use this config by default).
# ============================================================================
#
#  Deployment contract this dataset trains:
#      goal-planning network (5 Hz)          -> PASS_THROUGH / NORMAL_CORRECTION
#                                              / TURN_LEFT / TURN_RIGHT
#      local-avoidance network (30 Hz LSTM)  -> FLU velocity + yaw_rate
#
#  The ONLY expert is global.hierarchical_expert (inherited from
#  il_dataset_config.yaml, overridden here for the joint_v2 recipe).
#
#  INFORMATION BOUNDARY (strict):
#    - navigation_goal : final task endpoint.  Used ONLY for task
#      generation, final-success judgement and the 5 Hz student input
#      (navigation_goal_*).  It is NEVER written into the 30 Hz student
#      input goal_* fields.
#    - goal_* (30 Hz)  : the CURRENT effective target of the hierarchical
#      expert (PASS: original goal; NORMAL: live re-expressed world-latched
#      correction; TURN: live re-expressed world-latched turn direction,
#      distance_norm EXACTLY 1).
#    - truth (exact generated cylinders) : scene generation, start/goal
#      connectivity screening, collision/clearance/brake audits and the
#      episode commit decision ONLY.  Never feeds the expert path or any
#      label.  There is no PLY / global ESDF truth behind expert actions.
#
#  Preflight and real Flightmare collection use the SAME expert logic,
#  the SAME parameters and the SAME target encoding (the C++
#  PreflightSimulator wraps the same HierarchicalExpert).  The blueprint
#  manifest stores ONLY the original navigation endpoint per task plus the
#  new-architecture behavior-classifier statistics — no CausalLocalTarget
#  stream, no future 5 Hz correction sequence.
extends: il_dataset_config.yaml

global:
  # Manifest / dataset output directory.  NOTE: this was hard-coded to a
  # path on the OTHER machine (/home/devil/...) and must be writable by the
  # current user — adjust to your machine (e.g. ~/flightmare_ws/il_data_joint_v2).
  output_dir: "/home/rgzn/flightmare_ws/src/il_dataset/dataset/il_data_joint_v2"

  scene_generation:
    seed: 260812
    scene_key_prefix: "joint_v2"
    # 10 scenes = scene 0 (explicit EMPTY / CLEAR scene, 0 obstacles) +
    # 9 non-empty sparse/medium/dense × small/medium/large strata aligned
    # to the quota thresholds.  Coverage reflects the ACTUAL obstacle
    # geometry, never scene_id.
    scene_count: 10
    tasks_per_scene: 8
    minimum_tasks_per_scene: 6
    require_full_strata_coverage: true
    geometry:
      # Planner-required traversable passage (see il_dataset_config.yaml):
      # 2 * (0.30 + 0.30 + 0.05) + 2 * 0.05 = 1.40 m.
      minimum_surface_gap_m: 1.40
      boundary_margin_m: 1.20
      radius_min_m: 0.10
      radius_max_m: 6.00
      max_obstacles: 30
      height_m: 8.0
      free_cell_surface_clearance_m: 0.50
      esdf_resolution_m: 0.10

  task_generation:
    flight_height_m: 2.0
    min_task_distance_m: 4.0
    max_task_distance_m: 28.0
    # Initial yaw: aim at the goal + left/right symmetric random bias.
    initial_yaw_bias_deg: 15.0
    # Oversampling (blueprint-only, never a Flightmare flight timeout).
    # candidate_pool_multiplier ACTUALLY drives the per-scene preflight
    # candidate pool target = tasks_per_scene * multiplier; a budget
    # shortfall below it is an explicit generation failure.
    task_sample_attempts: 200
    candidate_pool_multiplier: 4
    qualification_attempt_budget: 400
    # Named finite preflight qualification budget (30 Hz ticks) — never
    # reused as a production episode timeout (fsm.trajectory_wall_timeout_s
    # is 0.0 = disabled, inherited from the base config).
    preflight_qualification_max_ticks: 1800
    # HARD quotas.  min_turn_per_side / left-right balance count ONLY real
    # TURN_LEFT/TURN_RIGHT tasks (NORMAL token laterality is never a TURN).
    quotas:
      min_per_behavior: 2
      min_turn_per_side: 2
      max_left_right_imbalance: 2
      min_per_density_level: 4
      min_per_radius_level: 4
      min_per_distance_level: 4
      distance_short_max_m: 9.0
      distance_long_min_m: 15.0
      radius_small_max_m: 0.6
      radius_large_min_m: 1.4
      density_sparse_max: 7.0
      density_dense_min: 14.0
      long_takeover_min_ticks: 30

  # ── Blueprint generation (inherits the full section from
  #    il_dataset_config.yaml; only the seed is re-stated here to match
  #    scene_generation.seed).  The warehouse free region is inherited
  #    ([-7,10] x [0,30]) and equals hierarchical_expert.region below. ──
  blueprint_generation:
    enabled: true
    base_seed: 260812
    # The rest of the section (warehouse, profiles, tasks, performance,
    # synthetic_observation, early_termination, distribution_targets,
    # requirements, legacy) is inherited from il_dataset_config.yaml.
    # These are re-stated explicitly because joint_v2 is the production
    # recipe and the tightened balance / budget gates MUST hold here.
    performance:
      max_task_candidates_per_scene: 48
      max_total_preflight_ticks: 650000
      parallel_tasks: 16
    # ── scene-level parallel pipeline (new architecture) ─────────
    # 主线程先生成 4 层级(小/中/大/混合) × 10 场景 = 40 个场景规格
    # (每层从稀疏到密集), 再由 16 个 worker 并行处理每个场景:
    # 栅格 → 随机起终点 → 贪婪A*连通 → 短/中/长距离均衡 → 简化专家(150tick, 分段标签)
    # → 标签; 汇总后按层级近似均衡挑选/删除/补齐。
    scene_parallel:
      enabled: true
      threads: 16
      levels: 4
      scenes_per_level: 10
      level_radius_min: [0.15, 0.5, 1.5, 0.15]
      level_radius_max: [0.5, 1.5, 3.0, 3.0]
      surface_gap_min_m: 1.2
      boundary_min_m: 0.6
      distance_short_max_m: 8.0
      distance_medium_max_m: 16.0
      # Full start->goal quick preflight.  Max ticks must be large enough
      # to REACH the goal (with detours); dt_scale>1 enlarges the dynamics
      # step (per tick travels dt_scale further) so the full trajectory
      # needs fewer ticks and finishes faster.  Same expert + same
      # Params2D clearance as the real collection.
      quick_preflight_max_ticks: 200
      quick_preflight_dt_scale: 6.0
      expected_collect_tasks: 400
    task_generation:
      macro_probe:
        enabled: true
        yaw_error_deg: 70.0
        # A probe biases sampling but does not reject a valid task when the
        # r29 local yaw-first branch emits a non-macro label.
        require_match: false
    # First collect a broad random candidate pool; deficit-driven weighting
    # and greedy selection are applied only after exploration.
    exploration:
      pool_first: true
      rounds: 2
      min_pool_tasks: 24
    synthetic_observation:
      walls_visible_in_observation: true
    early_termination:
      stall_window_ticks: 90
      stall_speed_mps: 0.02
      min_chicane_alternations: 2
    control_rate_hz: 30.0
    task_qualification:
      enabled: true
      require_both_sides_feasible: true
      run_astar_confirmation: true
      max_astar_expansions: 30000
      max_side_route_expansions: 20000
      max_total_side_route_expansions: 1200000
      max_total_qualification_expansions: 3000000
      # Prevent one highly blocked scene from consuming the whole global A*
      # budget.  Once this cap is reached, move to another random scene.
      max_expansions_per_scene: 300000
      start_recovery_max_radius_m: 0.5
      side_bias: 0.4
      min_route_stretch_for_long_detour: 1.5
    distribution_targets:
      # ── 5 Hz macro coverage ──────────────────────────────────────
      - {key: "macro:total", metric: "count:macro:total",
         target: 256, minimum: 128, weight: 0.5, minimum_hard: false}
      - {key: "macro:pass", metric: "count:macro:pass",
         target: 128, minimum: 64, weight: 1.0, minimum_hard: true}
      - {key: "macro:normal", metric: "count:macro:normal",
         target: 128, minimum: 64, weight: 1.0, minimum_hard: true}
      # New planner does LOCAL yaw-first turns whenever the target leaves
      # the usable FOV band.  The macro-turn probe is therefore only a
      # post-exploration sampling hint for genuine upper-level takeovers.
      - {key: "macro:turn_left", metric: "count:macro:turn_left",
         target: 64, minimum: 32, weight: 3.0, minimum_hard: true}
      - {key: "macro:turn_right", metric: "count:macro:turn_right",
         target: 64, minimum: 32, weight: 3.0, minimum_hard: true}
      - {key: "corr_angle_total", metric: "hist:macro_correction_angle",
         target: 192, minimum: 64, weight: 1.0, minimum_hard: true}
      # ── 30 Hz local coverage ─────────────────────────────────────
      - {key: "local:avoidance", metric: "count:local:avoidance",
         target: 128, minimum: 64, weight: 1.2, minimum_hard: true}
      - {key: "local:direct", metric: "count:local:direct",
         target: 128, minimum: 64, weight: 0.4, minimum_hard: false}
      - {key: "deflection_total", metric: "hist:local_deflection",
         target: 192, minimum: 64, weight: 1.0, minimum_hard: true}
      # ── depth proxy coverage (hard) ──────────────────────────────
      - {key: "depth:near", metric: "count:depth:near",
         target: 160, minimum: 64, weight: 1.0, minimum_hard: true}
      - {key: "depth:mid", metric: "count:depth:mid",
         target: 160, minimum: 64, weight: 1.0, minimum_hard: true}
      - {key: "depth:far", metric: "count:depth:far",
         target: 160, minimum: 64, weight: 1.2, minimum_hard: true}
      - {key: "depth:free", metric: "count:depth:free",
         target: 160, minimum: 64, weight: 1.0, minimum_hard: true}
      # ── initial yaw coverage (hard per bin) ──────────────────────
      - {key: "yaw:bin0", metric: "hist:yaw_error_abs:0",
         target: 6, minimum: 3, weight: 1.0, minimum_hard: true}
      - {key: "yaw:bin1", metric: "hist:yaw_error_abs:1",
         target: 6, minimum: 3, weight: 1.0, minimum_hard: true}
      - {key: "yaw:bin2", metric: "hist:yaw_error_abs:2",
         target: 6, minimum: 3, weight: 1.0, minimum_hard: true}
      - {key: "yaw:bin3", metric: "hist:yaw_error_abs:3",
         target: 6, minimum: 3, weight: 1.0, minimum_hard: true}
      - {key: "yaw:bin4", metric: "hist:yaw_error_abs:4",
         target: 6, minimum: 3, weight: 1.0, minimum_hard: true}
      - {key: "yaw:bin5", metric: "hist:yaw_error_abs:5",
         target: 6, minimum: 3, weight: 1.0, minimum_hard: true}
      # ── path length coverage (hard per class) ────────────────────
      - {key: "path:short", metric: "hist:path_length:0",
         target: 8, minimum: 4, weight: 0.8, minimum_hard: true}
      - {key: "path:medium", metric: "hist:path_length:1",
         target: 8, minimum: 4, weight: 0.8, minimum_hard: true}
      - {key: "path:long", metric: "hist:path_length:2",
         target: 8, minimum: 4, weight: 1.2, minimum_hard: true}
      # ── balances (structural, soft) ──────────────────────────────
      - {key: "balance:turn",
         metric: "balance:macro:turn_left/macro:turn_right",
         target: 0.20, minimum: 0.20, weight: 3.0, minimum_hard: false}
      - {key: "balance:yaw", metric: "balance:yaw:left/yaw:right",
         target: 0.20, minimum: 0.20, weight: 1.0, minimum_hard: false}
    requirements:
      min_tasks: 160
      min_tasks_per_scene: 8
      max_tasks_per_scene: 16
      min_selected_scenes: 4
      max_turn_imbalance_ratio: 0.20
      max_yaw_imbalance_ratio: 0.20
      min_grouped_deflection_samples: 8
      min_grouped_correction_samples: 4
    # Real-collection top-up (item 十): after the first Flightmare pass,
    # the 5 Hz / 30 Hz label distributions are re-derived from the
    # COMMITTED episodes ONLY and the soft gaps caused by real episode
    # rejects are auto-filled from the blueprint candidate pool
    # (preflighted).  max_rounds caps the number of top-up passes; the
    # pool is never re-used and a round with zero new committed episodes
    # stops the loop.
    topup:
      max_rounds: 3

  # ── Hierarchical local expert (production path) ───────────────────
  # Overrides the public defaults in il_dataset_config.yaml.  R = 5.0 m
  # (single perception range); normal_distance_reserve_m = 0.5 ⇒ ordinary
  # distance_norm max = 0.9 < 1.  The region matches the joint_v2 scene.
  hierarchical_expert:
    enabled: true
    control_hz: 30.0
    macro_update_hz: 5.0
    region:
      min_x: -7.0
      max_x: 10.0
      min_y: 0.0
      max_y: 30.0
    drone_radius_m: 0.30
    scene_safety_clearance_m: 0.0   # unused: ESDF geometric envelope removed
    macro_route_clearance_margin_m: 0.0
    goal_tolerance_m: 0.40
    observation:
      fov_deg: 90.0
      range_m: 5.0
      resolution: 0.10
      ray_angular_res_deg: 0.5
      history_max_age_ticks: 120
      # Older cells remain diagnostic history but do not hard-block local
      # replanning until refreshed by the current view.
      planning_history_max_age_ticks: 45
      # R25: consecutive current-frame FREE confirmations required to clear
      # a stale OCCUPIED history cell (3 = 0.1 s).  Prevents phantom
      # blockage from old observations (joint_v2_000004_4ab1e354).
      free_clear_confirmations: 3
    # 5 Hz VisibilityTargetCorrector (all keys optional; defaults in
    # il_expert_config.py).  brake_confirm_ticks_5hz: consecutive 5 Hz
    # updates the vehicle must stay at/below stationary_speed_mps before a
    # latched brake-before-search is released and the TURN step is
    # published (2 updates = 0.4 s).  waypoint_reached_tolerance_m:
    # distance at which a fixed NORMAL_CORRECTION waypoint counts as
    # reached (kept small so a bypass waypoint is not abandoned early).
    corrector:
      brake_confirm_ticks_5hz: 2
      waypoint_reached_tolerance_m: 0.3
      # R26: within this distance of the original goal the macro never
      # issues a locked-side search TURN (hands the goal to local, which
      # rotates toward it / micro-approaches).  Only a hard corridor block
      # releases the capture state.  limit_cycle_*: macro-level watchdog on
      # the original goal — force a fresh local handoff when no progress
      # for the window (3 s) while directives keep changing.
      terminal_capture_radius_m: 1.0
      limit_cycle_goal_progress_m: 0.1
      limit_cycle_window_5hz: 15
      takeover_confirm_ticks_30hz: 12
    local_planner:
      max_yaw_rate: 1.5
      # R28c: raised from 4.0 so the drone can follow a freshly re-planned
      # trajectory quickly (reverse a full-rate turn in ~0.3 s, not ~0.6 s).
      max_yaw_accel: 8.0
      # R28c/R28g: local plan endpoint must stay within this bearing band of
      # the current target direction (deg); big detours belong to the upper
      # layer.  35 = the +-35° scan band: a legitimate local detour up to the
      # band is kept (task 401 needs ~31° around obs7); 40°+ spirals (task 33)
      # are still rejected for the macro.  Was 30.0 -> killed a working detour
      # at a razor-thin cliff when the nose drifted across it.
      max_local_deviation_deg: 35.0
      # Search this narrow band first; use the full band only when no local
      # candidate exists, avoiding unnecessary FOV-edge detours.
      preferred_local_deviation_deg: 20.0
      # R26: terminal micro-approach radius — inside 0.8 m with an in-FOV,
      # hard-clear path the planner drives the proportional terminal
      # controller directly (bridges the 0.4-0.8 m B-spline dead zone).
      terminal_micro_approach_m: 0.8
      # ── R27: plan/track split ───────────────────────────────────
      # Re-optimise the B-spline every N control ticks (3 = 10 Hz); between
      # replans PURSUE the committed trajectory with an arc-length lookahead
      # so the executed path follows ONE spline instead of the envelope of
      # per-tick heads (kills receding-horizon head-drift accumulation).
      replan_interval_ticks: 3
      pursuit_lookahead_m: 0.6    # arc-length lookahead along the spline
      track_max_cross_track_m: 0.5  # max deviation before forced replan
      track_min_front_m: 0.8        # replan when < this much path remains
      # R27: temporal anchor — soft cost pulling consecutive EGO replans
      # toward the previous committed plan (0 disables the cost term).
      ego_lambda_ref: 0.3
    altitude_hold:
      kp: 1.5
      kd: 0.6
      deadband_m: 0.02
      max_speed_mps: 0.6
