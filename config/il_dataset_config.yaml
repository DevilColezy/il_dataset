# ============================================================================
#  Imitation Learning Dataset Collection — Two-Level Navigation Expert (schema v22)
# ============================================================================
#
#  Architecture:
#    task_oracle        privileged global map + cost-to-go (built once/task)
#    observed_map       causal rolling occupancy + ESDF + known mask (C++)
#    macro_expert       5 Hz strategic state machine
#    macro_candidates   5 Hz candidate generation (C++)
#    local_recoverability 5 Hz query: can the local layer recover direct intent?
#    local_path_search  observed-map A* (C++, 30 Hz)
#    trajectory_optimization  B-spline trajectory optimization (C++, 30 Hz)
#    yaw_planning       FOV-constrained yaw trajectory (C++)
#    privileged_intervention  privileged LOCAL-SCALE audit (C++, section II)
#    trajectory_controller  30 Hz command extraction + limits
#    execution_safety   fresh/cached/rotate/brake/emergency selection
#    dataset_logging    recorded fields and files
#
#  Yaw convention (unified): yaw = atan2(world_y, world_x) - pi/2
#  (yaw=0 => body +Y faces world +Y; nose world dir = (-sin yaw, cos yaw)).
#
#  Every parameter below is read and used by the runtime code.
# ============================================================================

global:
  scene_id: 1
  pub_port: "10253"
  sub_port: "10254"
  output_dir: ""

  # ── FSM timeouts (seconds) ─────────────────────────────────────────
  fsm:
    connect_timeout:         60.0
    pc_export_timeout:      600.0
    drone_stable_timeout:    10.0
    trajectory_timeout:     120.0
    # Independent WALL-CLOCK cap per task (section "time"): the sim-based
    # trajectory_timeout alone cannot bound a stalled simulation or a
    # severely degraded loop.  Generous, so it only fires on pathological
    # stalls; never affects navigation timing.
    trajectory_wall_timeout_s: 600.0
    keep_alive_period:        3.0
    # Keep AvoidBench's 5 s connection timeout from reloading the scene
    # during the blocking map-build / task-generation phases.
    block_keepalive_period:   2.0
    # Wait for the first depth frame before recording a task (seconds).
    depth_warmup_timeout:    30.0

  # ── Scene runtime / settle (section VIII) ─────────────────────────
  # `ready` is ONLY an initial AvoidBench handshake condition.  After a
  # procedural object update we settle by TIME (no second ready is
  # expected): keep re-sending the scene Pose and drain the queue, then
  # proceed to the point cloud export once settle_time_s elapses.
  scene_runtime:
    settle_time_s:           8.0
    settle_keepalive_hz:     5.0

  # ── Depth camera ───────────────────────────────────────────────────
  depth:
    width:  640
    height: 480
    fov:    90.0
    max_m:   5.0
    near:    0.01
    far:  1000.0

  # ── Point cloud export (privileged global map input) ───────────────
  # Completion is decided by the PLY file itself (existence + stable
  # size); get_pc_msg / save_pc_success messages are only diagnostics.
  # VERIFIED AvoidBench semantics (SavePointCloud.cs): `origin` is the
  # CENTER of the sampled box and `range` is the FULL extent, so the box
  # is origin +/- range/2 = x[-12,15] y[-6,38] z[-0.5,7.5] — designed to
  # cover the factory (Warehouse) WALLS.
  pointcloud:
    range:        [27.0, 44.0, 8.0]
    origin:       [1.5, 16.0, 3.5]
    resolution:   0.10
    export_file:  "obstacle_cloud.ply"
    min_file_bytes: 1024
    stable_window_s:  0.5
    max_retries:      3

  # ── Vehicle geometry ───────────────────────────────────────────────
  vehicle:
    radius_m:        0.30
    # Scene-generation-only geometry spacing margin.  It is NOT a
    # navigation clearance: the unified navigation safety boundary is
    # `navigation.clearance_m` below.
    safety_margin_m: 0.20

  # ── UNIFIED navigation clearance (problem 4) ───────────────────────
  # The SINGLE effective safety boundary for EVERY navigation module
  # (global connectivity / cost-to-go, observed-map A*, local
  # recoverability, privileged intervention, trajectory optimisation /
  # validation, goal-stop, braking risk and start/goal/task generation).
  # Both ESDFs (observed and privileged) already subtract the vehicle
  # radius, so this is purely the additional margin on top of the inflated
  # vehicle body.  No module may use a different, more permissive value.
  navigation:
    clearance_m: 0.20

  # ── Procedural scene generation (section XXII/XXXII-XXXVI) ─────────
  scene_generation:
    enabled: true
    seed: 12345
    tasks_per_scene: 12
    minimum_tasks_per_scene: 1
    max_generation_attempts: 24
    obstacle_region:
      # Factory (Warehouse, scene_id=1) interior — VERIFIED 'fixed' values
      # (x[-7,10] y[0,30] z[0,8]).  The point-cloud grid covers the walls
      # around it; obstacles must stay inside this inner region.
      min_x: -7.0
      max_x: 10.0
      min_y: 0.0
      max_y: 30.0
      min_z: 0.0
      max_z: 8.0
    geometry:
      # Full-height cylinders (sections XV-XVIII): obstacle height and
      # center are DERIVED from the region vertical span
      # (height = max_z - min_z, center_z = 0.5*(min_z + max_z)) so all
      # independent/cluster/chain obstacles cover the whole flight range
      # (2.5D LEFT/RIGHT topology).  `height_m` is informational only.
      height_m:              8.0
      minimum_surface_gap_m: 0.30
      boundary_margin_m:     0.6
      max_obstacles:       120
    min_free_fraction:      0.35
    coarse_grid:            24
    profiles:
      - name: sparse_mixed
        scene_count: 20
        radius_min_m: 0.15
        radius_max_m: 1.2
        target_occupancy: [0.05, 0.10]
        cluster_probability: 0.10
        chain_probability:   0.05
      - name: dense_small
        scene_count: 20
        radius_min_m: 0.10
        radius_max_m: 0.50
        target_occupancy: [0.08, 0.15]
        cluster_probability: 0.20
        chain_probability:   0.10
      - name: mixed_scale
        scene_count: 30
        radius_min_m: 0.10
        radius_max_m: 2.5
        target_occupancy: [0.08, 0.18]
        cluster_probability: 0.15
        chain_probability:   0.10
      - name: clustered_barrier
        scene_count: 30
        radius_min_m: 0.10
        radius_max_m: 1.0
        target_occupancy: [0.10, 0.20]
        cluster_probability: 0.30
        chain_probability:   0.20

  # ── Multi-scale task generation (section XXVIII/XXXVII-XXXIX) ──────
  # Behavioural scale classes (TaskClass) are generation/diagnostic only —
  # never student inputs and never forced onto the macro expert mode.
  task_generation:
    enabled: true
    # VERIFIED 'fixed' flight height: 1.8-2.2 m inside the factory z[0,8].
    flight_height_m: 2.0
    task_seed_base: 999983
    # Factory drivable box covering all verified start/goal sampling
    # regions (starts y~-1 / x~-8 / x~11.5; goals y~31 / x~-8 / x~11.5).
    # Sits inside the point-cloud grid x[-12,15] y[-6,38] z[-0.5,7.5].
    region_min: [-8.5, -1.5, 0.0]
    region_max: [11.5, 32.0, 8.0]
    distance_bands:
      short:
        min_m: 4.0
        max_m: 8.0
      medium:
        min_m: 8.0
        max_m: 16.0
      long:
        min_m: 16.0
        max_m: 28.0
    class_weights:
      open_direct:       0.10
      local_reactive:    0.30
      near_occluded:     0.15
      strategic_blocker: 0.20
      asymmetric_side:   0.10
      ambiguous_side:    0.05
      compound_barrier:  0.10
    sampling:
      candidate_batch_size: 64
      maximum_batches_per_scene: 6
      max_goal_sample_attempts: 40   # per start; exhausted -> candidate rejected
      lateral_probe_offset_m: 1.2
      lateral_probe_spacing_m: 0.6
      lateral_probe_count: 4
    classification:
      near_occluded_max_blocker_distance_m: 2.0
      compound_min_blockers: 2
      ambiguous_max_path_diff_m: 1.0
    initial_yaw:
      goal_aligned_probability: 0.5
      random_offset_deg: 60.0
    runtime_classification:
      enabled: true

  # ── Recording rate ─────────────────────────────────────────────────
  control:
    # Unity depth at 640x480 cannot reliably be consumed at 50 Hz; 30 Hz is
    # the record (and control sample) rate.
    record_hz:  30.0

  # ── Flightmare dynamics backend (retained execution layer) ─────────
  dynamics:
    backend: "flightmare"
    control_mode: "velocity_yaw_rate"
    simulation_hz: 200.0
    control_hz:     50.0
    render_hz:      20.0
    deterministic_time: true
    velocity_controller:
      use_existing_flightmare_controller: true
      kp_velocity: [3.0, 3.0, 3.0]
      ki_velocity: [0.0, 0.0, 0.0]
      kd_velocity: [0.2, 0.2, 0.2]
      maximum_acceleration_mps2: [4.0, 4.0, 2.0]
      maximum_tilt_deg: 35.0
      maximum_yaw_rate_rps: 1.5
      maximum_yaw_acceleration_rps2: 4.0
      attitude_gain: 6.0
      maximum_body_rate_rps: 6.0
      integrator_limit: [1.0, 1.0, 0.5]
    reset:
      settle_time_s: 0.30
      initial_velocity_noise_std_mps: [0.0, 0.0, 0.0]
      initial_angular_velocity_noise_std_rps: [0.0, 0.0, 0.0]

  # ── Privileged global map (section VII) ────────────────────────────
  # The global ESDF value is  esdf = distance_to_obstacle_surface -
  # vehicle_radius.  Free space is everywhere  esdf > navigation.clearance_m
  # (never re-subtracting the vehicle radius).
  task_oracle:
    # Global privileged map config.  Tasks are now generated ONLINE per
    # scene (scene_generation / task_generation); no external manifests
    # are required as inputs (section VI).
    map_resolution_m:      0.10
    map_margin_m:          2.0
    max_esdf_distance_m:   8.0
    min_z_m:              -5.0
    max_z_m:               8.0
    cost_to_go_cap_m:     30.0
    # Candidate scoring weights (lower score = better).
    weight_observed_cost:  1.0
    weight_cost_to_go:     2.0
    weight_connectivity:   6.0
    weight_clearance:      1.0
    weight_goal_progress:  1.0
    weight_information:    0.5
    weight_yaw_cost:       0.5
    weight_side_switch:    1.0
    weight_repeat:         0.5
    side_switch_penalty:   1.0
    repeat_penalty:        1.0
    clearance_target_m:    0.6
    yaw_cost_scale_rad:    1.0

  # ── Causal observed map (section X.1) ──────────────────────────────
  observed_map:
    resolution:                  0.10
    size_x_m:                   12.0
    size_y_m:                   12.0
    size_z_m:                    5.0
    history_seconds:             8.0
    occupied_endpoint_margin_m:  0.05
    esdf_max_distance_m:         5.0
    rebuild_every_n_frames:      3
    depth_integration_step:      2
    free_space_sample_spacing_m: 0.10
    recenter_threshold_m:        3.0

  # ── 5 Hz macro expert (section IV) ─────────────────────────────────
  macro_expert:
    update_hz:               5.0
    # Direct-guide lookahead (min(goal_distance, this)).
    macro_lookahead_distance_m: 4.5
    # DIRECT long no-progress (goal distance not decreasing for this long)
    # is ALSO causal evidence -> macro intervention, never an immediate
    # episode FAILED (section XI/XII).
    direct_intervention_timeout: 5.0
    # 30 Hz -> 5 Hz interval feedback thresholds for DIRECT causal evidence
    # (sections XXV/XXVI): counters accumulate per MACRO TICK with decay,
    # so a single occasional bad frame never intervenes while consecutive
    # unstable intervals do.
    causal_feedback:
      interval_failure_threshold:  2      # planning failures within one interval
      local_failure_macro_ticks:   2      # consecutive bad intervals -> evidence
      cached_ratio_threshold:      0.5    # cached_frames / interval_frames
      cached_macro_ticks:          2
      brake_ratio_threshold:       0.5
      brake_macro_ticks:           2
      emergency_macro_ticks:       1      # any emergency interval -> strong evidence
    # Rolling SIDE / OBSERVE progress thresholds (section VII/XVI).
    side_no_progress_seconds:   6.0
    observe_no_information_timeout: 4.0
    progress_cost_epsilon_m:    0.10
    local_path_fail_threshold:  2
    # Blocker tracking (sections VII/X): world-geometry association of the
    # ACTIVE blocker; side memory is rebound to a confirmed NEW blocker
    # only after blocker_rebind_ticks consecutive off-track observations.
    blocker_association_distance_m: 1.5
    blocker_overlap_pad_m:          0.5
    blocker_lost_grace_s:           2.0
    blocker_rebind_ticks:           2
    # Stable DIRECT release (sections X-XV): after this many CONSECUTIVE
    # macro ticks with DIRECT genuinely stable (observed recoverable + no
    # causal evidence + no local-unrecoverable interval), the old blocker
    # topology memory is released.  A single DIRECT tick never releases it.
    direct_release_ticks:           3
    # Goal reached condition (distance + speed).
    goal_tolerance_m:           0.30
    goal_speed_tolerance_mps:   0.20
    # OBSERVE rotate sweep speed and cap.  OBSERVE never FAILs on a short
    # fixed duration: it runs while it keeps gaining information (section
    # XIX/XX).  The absolute safety limit below is only a large final
    # anti-deadlock guard, well above any single observation window.
    observe_rotation_rate_rps:  1.5
    # OBSERVE yaw sweep cap (half-FOV of the camera).
    observe_fov_half_deg:      45.0
    # Active-observation scan lifecycle (sections XXI-XXXV): rotation-only
    # stagnation cap, minimum info gain for a viewpoint to count as clearly
    # better than continuing the sweep, and previous-viewpoint hysteresis.
    max_stagnant_rotate_s:            2.0
    observe_info_gain_move_threshold: 0.05
    observe_viewpoint_hysteresis_m:   0.8
    observe_viewpoint_hysteresis_bonus: 0.15
    # Distance a real OBSERVE_MOVE must travel before the current
    # observation anchor is considered "new" (sections XXI-XXIV): beyond
    # this, scan exhaustion / yaw reference / stagnation / info baselines
    # are re-based at the new viewpoint.  Small drifts never reset scan
    # state (section XLIII).
    viewpoint_reset_distance_m:      0.35
    # Episode-level final anti-deadlock guard (section XXII).
    macro_intervention_absolute_safety_timeout: 45.0
    # Fixed left preference for genuinely tied sides (never unconditional).
    left_preferred_on_tie:      true
    # Confidence gate: below this the macro marks labels ambiguous.
    confidence_gate:            0.5

  # ── Macro candidate generation (section VIII) ──────────────────────
  macro_candidates:
    lookahead_distance_m:       4.5
    side_corridor_length_m:     4.0
    side_corridor_radius_m:     0.55
    edge_search_radius_m:       5.0
    candidate_spacing_m:        0.5
    observe_step_m:             0.6
    # Minimum candidate->current distance for an OBSERVE candidate to be
    # emitted.  Zero-distance probes are never generated (no fake MOVE).
    min_observe_move_distance_m: 0.15
    max_frontier_candidates:    8
    frontier_standoff_m:        0.45
    goal_frontier_cone_deg:     70.0
    corridor_check_spacing_m:   0.10
    # ── Active observation viewpoint search (section XV) ───────────
    # A small lateral x forward lattice around the current position on BOTH
    # sides replaces the old two fixed ±observe_step_m probes.  Endpoints
    # must be known-free with the unified navigation clearance
    # (`navigation.clearance_m`); reachability is verified with a real
    # observed LocalPathSearch (FULL_GOAL_REACHED only, never a straight-
    # corridor proxy).  All fields are diagnostic / expert-side; none enter
    # the student input.
    observation:
      lateral_distances_m:       [0.4, 0.8, 1.2, 1.6]
      forward_distances_m:       [0.0, 0.4, 0.8, 1.2]
      max_viewpoint_candidates:  24
      max_viewpoint_searches_per_tick: 8
      # Minimum FULL searches reserved for GOAL_FRONTIER each tick (the
      # lattice can never starve the frontier source).
      min_frontier_searches_per_tick: 2
      max_observe_move_distance_m: 6.0
      information_gain_radius_m: 1.2

  # ── Local recoverability query (section VI) ────────────────────────
  # The clearance is the unified `navigation.clearance_m` (single source).
  # These bounds define the LOCAL capability and are shared with the
  # privileged local-scale audit (section II): observed and privileged use
  # the SAME rejoin distance, duration, path-length and detour limits.
  local_recoverability:
    rejoin_distance_m:           2.5
    # Privileged A* search-region expansion in REAL METRES (section III):
    # perpendicular / along the guide direction, so the search can route
    # around a local obstacle (a few 0.1 m cells is NOT enough).
    search_lateral_margin_m:     2.0
    search_longitudinal_margin_m: 2.0
    max_path_length_m:           6.0
    max_duration_s:              2.5
    max_detour_ratio:            1.6
    min_terminal_alignment:      0.5
    min_goal_progress_m:         0.30
    nominal_speed_mps:           1.8
    side_corridor_length_m:      4.0
    side_corridor_radius_m:      0.55
    edge_search_radius_m:        5.0

  # ── Observed-map A* (section X.2) ──────────────────────────────────
  # The unified navigation clearance lives in `navigation.clearance_m`.
  local_path_search:
    side_bias_gain:     2.0
    max_expansions: 200000
    max_time_ms:        20.0
    region_margin_m:     2.0
    forbid_unknown:     true

  # ── Privileged LOCAL-SCALE audit (section II/III) ──────────────────
  # Runs a short-range A* on the FULL map with geometry matching the
  # observed local recoverability (same rejoin distance and capability
  # bounds from local_recoverability); ALLOWS local bypass.  Its result is
  # an auxiliary label / audit — it never directly changes the main macro
  # mode without causal evidence.  The clearance is the unified
  # `navigation.clearance_m`.
  privileged_intervention:
    search_max_time_ms:    20.0
    # Loop detection (section IX).
    loop_ignore_recent_s:   2.5
    loop_leave_radius_m:    1.6
    loop_revisit_radius_m:  0.8
    loop_min_speed_mps:     0.3
    loop_min_revisits:      2
    loop_history_size:     60
    # Side-selection cost margin (Python): only switch sides when the
    # privileged global cost difference is at least this large.
    cost_margin_m:          2.0

  # ── B-spline trajectory optimization (section X.4) ─────────────────
  # The clearance is the unified `navigation.clearance_m` (both the soft
  # optimisation target and the hard validation floor).  The A* search and
  # yaw parameters live in local_path_search and yaw_planning respectively
  # (single source per concern).
  trajectory_optimization:
    planning_time_budget_ms: 30.0
    trajectory_dt:           0.04
    horizon_time:            2.5
    optimizer:              "auto"
    control_points:          12
    max_iterations:       10000
    convergence_tolerance:    1.0e-4
    initial_step_size:        0.1
    minimum_step_size:        1.0e-4
    seed_trust_radius:        0.35
    horizontal_avoidance_only: true
    collision_check_spacing:  0.05
    weight_path_length:       0.05
    weight_smooth:            1.0
    weight_jerk:              0.2
    weight_obstacle:          4.0
    weight_dynamics:          1.0
    nominal_speed:            1.8
    max_velocity:             2.5
    max_acceleration:         8.0
    max_jerk:                50.0
    lookahead_distance:       4.0
    terminal_speed_ratio:     0.85
    goal_stop_tolerance_m:    0.4
    warm_start_max_age_s:     0.25
    warm_start_max_terminal_deviation_m: 1.5

  # ── Yaw planning (section XI) ──────────────────────────────────────
  yaw_planning:
    max_yaw_rate:        2.0
    max_yaw_accel:       8.0
    fov_half_deg:       45.0
    fov_margin_deg:      5.0
    speed_threshold_mps: 0.20

  # ── 30 Hz trajectory controller (section XII) ──────────────────────
  trajectory_controller:
    velocity_lookahead_time_s:  0.08
    position_gain:              2.0
    acceleration_feedforward_time_s: 0.30
    yaw_gain:                   2.0
    max_velocity_mps:           2.5
    max_acceleration_mps2:      3.5
    max_jerk_mps3:             25.0
    max_yaw_rate_rps:           2.0
    max_yaw_accel_rps2:         8.0
    emergency_brake_distance_m: 0.8
    brake_deceleration_mps2:    3.0

  # ── Execution safety / degradation (section XIII) ──────────────────
  execution_safety:
    max_plan_age_s:          0.20
    min_remaining_trajectory_s: 0.10
    max_position_error_m:    0.50
    max_velocity_error_mps:  1.00
    emergency_deceleration_mps2: 5.0
    brake_reaction_delay_s:  0.10
    max_brake_hold_seconds:  1.0
    max_emergency_stop_seconds: 2.0

  # ── Dataset logging (section XIV) ──────────────────────────────────
  dataset_logging:
    schema_version: 22
    depth_in_memory: true
    write_local_plan_points: true
    collect_privileged_diagnostics: true
    perception_range_m: 5.0
    flush_interval_rows: 64
    depth_png_compress_level: 4
    # Debug mode (section "debug"): when true, every 5 Hz macro tick also
    # writes the expert's internal state to trace.jsonl inside each
    # episode directory, for post-hoc review with scripts/debug_viewer.py.
    # Pure diagnostic — never part of the student input.
    debug_trace: false

  # ── Sync & commit thresholds ───────────────────────────────────────
  sync:
    max_acceptable_latency_ms:     250.0
    max_latency_violation_pct:       1.0
    catastrophic_latency_ms:      5000.0
    unity_response_timeout_s:        2.0
    max_unmatched_pct:               1.0
    max_none_depth_pct:             20.0

  commit:
    strict_collision_policy: true
    atomic_rename:           true
