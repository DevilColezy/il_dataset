# ============================================================================
#  Imitation Learning Dataset Collection — Configuration  v5
# ============================================================================
#  Obstacle regimes:
#    small_only           – radius 0.15 – 1.0 m   (diameter 0.3 – 2.0 m)
#    small_medium         – radius 0.15 – 2.5 m   (diameter 0.3 – 5.0 m)
#    large_medium_small   – radius 0.15 – 4.0 m   (diameter 0.3 – 8.0 m)
#
#  Workflow  (state machine):
#    BOOT → WAIT_UNITY → GEN_OBSTACLES → WAIT_SCENE → EXPORT_PC →
#    WAIT_PC → BUILD_ESDF → GEN_PAIRS → PLAN_GLOBAL_PATHS →
#    VALIDATE_GLOBAL_PATHS → RESET_DRONE → WAIT_STABLE →
#    INIT_LOCAL_PLANNER → START_RECORDING → ONLINE_PLAN_AND_RECORD →
#    STOP_RECORDING → VALIDATE_AND_COMMIT → NEXT_TRAJ / NEXT_CONFIG
#
#  Schema version: 5
#    - v1: il_pipeline.py     (global.flight, global.connect_timeout, scene.trajectories)
#    - v2: il_manager.py      (global.fsm, global.control, global.start_goal)
#    - v3: il_manager.py v3   (sync diagnostics, atomic commit, validated config)
#    - v4: added vel_source, body_frame_convention metadata
#    - v5: receding-horizon local planner, C++ pybind11 backend, global A* only
# ============================================================================

# ── Global settings ──────────────────────────────────────────────────────────
global:
  scene_id: 1
  pub_port: "10253"
  sub_port: "10254"
  output_dir: ""

  # ── FSM timeouts (seconds) ───────────────────────────────────────────
  fsm:
    connect_timeout:       60.0
    scene_settle_timeout:  10.0
    pc_export_timeout:    600.0
    esdf_build_timeout:    60.0
    drone_stable_timeout:  10.0
    trajectory_timeout:   120.0           # max seconds per trajectory flight
    keep_alive_period:      3.0

  # ── Depth camera ─────────────────────────────────────────────────────
  depth:
    width:  640
    height: 480
    fov:    90.0
    max_m:   5.0
    near:    0.01
    far:  1000.0

  # ── Point-cloud & ESDF ───────────────────────────────────────────────
  pointcloud:
    range:      [30.0, 50.0, 8.0]
    origin:     [0.0, 20.0, 3.5]
    # A 0.40 m-wide vehicle spans four samples at 0.10 m.  Keep point-cloud
    # and ESDF resolution equal so voxelisation cannot create surface holes.
    resolution: 0.10
  esdf:
    resolution:    0.10
    drone_radius:  0.20              # 0.40 m physical vehicle width

  # ── Control & recording (async: high-freq control, lower-freq save) ──
  control:
    # Keep command and capture clocks aligned.  At 640x480 the Unity depth
    # pipeline did not consume 50 Hz reliably, which caused queued poses to be
    # discarded and produced mixed 20/40/60/80 ms frame intervals.
    control_hz: 50.0
    # Windows Unity + WSL transport target.  640x480 RFloat depth is about
    # 1.2 MiB/frame, so 30 Hz remains practical while looking smooth.
    record_hz:  30.0

  # ── Obstacle generation shared defaults ──────────────────────────────
  obstacle:
    area_x:  [-9.0, 11.0]
    area_y:  [0.0, 30.0]
    height:   8.0
    # SmartObstacleSampler produces an obstacle surface gap of:
    # min_gap + 2*drone_radius + safety_margin = 0.80 m.  A 0.40 m vehicle
    # therefore has 0.40 m total spare width in every generated pairwise gap.
    min_gap:        0.20
    drone_radius:   0.20
    safety_margin:  0.20
    border_margin:  0.20               # avoids creating an oversized perimeter corridor
    candidate_attempts: 60
    shrink_on_fail:  true
    shrink_factor:    0.85
    size_interval:    0.5
    scale_weights: [0.72, 0.23, 0.05]   # small / medium / large; large is rare
    avoid_x:      0.0
    avoid_y:      0.0
    avoid_radius: 0.0
    ground_z:     0.0

  # ── Phase 3: Scene & Task Generation ───────────────────────────────
  scene_generation:
    enabled: true

    source: "procedural_yaml"
    obstacle_type: "cylinder"

    seed: 12345
    max_scene_generation_attempts: 500
    max_obstacle_sampling_attempts: 5000

    obstacle_region:
      x_min: -9.0
      x_max: 11.0
      y_min: 0.0
      y_max: 30.0
      z_min: 0.0
      z_max: 8.0

    outside_obstacle_region_policy: "free"

    cylinder:
      count_min: 6
      count_max: 10

      radius_min_m: 0.30
      radius_max_m: 2.0

      height_min_m: 8.0
      height_max_m: 8.0

      require_full_vertical_blocking: true

      region_boundary_margin_m: 0.30

      minimum_surface_gap_m: 0.80
      minimum_inflated_gap_m: 0.40

      allow_overlap: false
      allow_inflated_component_merging: false

    topology_validation:
      enabled: true

      grid_resolution_m: 0.10
      validation_halo_m: 3.0

      vehicle_radius_m: 0.30
      safety_margin_m: 0.10

      forbid_enclosed_free_components: true
      forbid_dead_ends: false
      forbid_u_shapes: false

      minimum_navigable_corridor_width_m: 0.60

      escape_ray_count: 24
      minimum_escape_sector_width_deg: 35.0
      minimum_separated_escape_sectors: 2
      minimum_escape_sector_separation_deg: 80.0

      dead_end_probe_spacing_m: 0.50
      dead_end_minimum_depth_m: 1.50

    task_generation:
      enabled: true

      max_task_sampling_attempts: 1000
      tasks_per_scene: 5

      start_height_min_m: 1.8
      start_height_max_m: 2.2
      goal_height_min_m: 1.8
      goal_height_max_m: 2.2
      maximum_start_goal_height_difference_m: 0.20

      start_clearance_m: 0.60
      goal_clearance_m: 0.60

      minimum_start_goal_distance_m: 8.0
      maximum_start_goal_distance_m: 40.0

      require_direct_path_blocked: true
      direct_path_corridor_radius_m: 0.35

      minimum_direct_blocker_count: 1
      maximum_direct_blocker_count: 3

      require_astar_reachable: true

      minimum_detour_ratio: 1.05
      maximum_detour_ratio: 1.80

      start_sampling_region:
        x_min: -8.0
        x_max: 10.0
        y_min: -2.0
        y_max: -1.0

      goal_sampling_region:
        x_min: 8.0
        x_max: 10.0
        y_min: 30.0
        y_max: 32.0

    side_cost:
      enabled: true

      minimum_cost_difference_ratio: 0.15
      portal_lateral_clearance_m: 0.60
      portal_longitudinal_offset_m: 0.50

      require_both_sides_feasible: false
      reject_nearly_equal_sides: true

    observability_audit:
      enabled: true

      require_runtime_side_consistency: true
      minimum_observed_cost_difference_ratio: 0.05

      maximum_invalid_frames_before_reject: 5
      reject_episode_on_inconsistent_side_choice: true

  # ── Phase 4: ESDF Cache ────────────────────────────────────────────
  esdf_cache:
    enabled: true

    cache_root: "cache/esdf"

    global:
      compression: true

      validate_hash: true
      validate_metadata: true
      lock_timeout_s: 120.0

      builder_version: 1

    observed:
      enabled: true

      rebuild_only_on_map_change: true
      upload_only_on_revision_change: true
      maximum_cached_revisions: 2

  # ── Phase 4: DAgger ────────────────────────────────────────────────
  dagger:
    enabled: false

    round_id: 0
    rollout_mode: "expert"

    seed: 12345

    policy:
      backend: "disabled"
      model_path: ""
      device: "cpu"

      python_module: ""
      python_class: ""

      onnx_input_names: {}
      onnx_output_names: {}

      recurrent: true
      inference_timeout_ms: 30.0

    mixture:
      mode: "stochastic_switch"

      beta_schedule: "linear"
      beta_start: 1.0
      beta_end: 0.0
      beta_decay_rounds: 5

      sample_scope: "frame"

    safety:
      enabled: true

      override_on_invalid_policy_output: true
      override_on_policy_timeout: true
      override_on_observed_collision_risk: true

      minimum_observed_clearance_m: 0.35
      minimum_ttc_s: 0.60
      prediction_horizon_s: 1.00

      fallback_command: "hover"

    aggregation:
      output_root: "dataset/dagger"

  # ── Phase 4: Dynamics ──────────────────────────────────────────────
  dynamics:
    backend: "flightmare"

    control_mode: "velocity_yaw_rate"

    simulation_hz: 200.0
    control_hz: 50.0
    render_hz: 30.0

    deterministic_time: true

    allow_legacy_kinematic_backend: true
    legacy_backend_explicit_only: true

    velocity_controller:
      use_existing_flightmare_controller: true

      kp_velocity: [3.0, 3.0, 3.0]
      ki_velocity: [0.0, 0.0, 0.0]
      kd_velocity: [0.2, 0.2, 0.2]

      maximum_acceleration_mps2: [4.0, 4.0, 2.0]
      maximum_tilt_deg: 35.0
      maximum_yaw_rate_rps: 2.0
      attitude_gain: 6.0
      maximum_body_rate_rps: 6.0

      integrator_limit: [1.0, 1.0, 0.5]

    reset:
      settle_time_s: 0.30
      initial_velocity_noise_std_mps: [0.0, 0.0, 0.0]
      initial_angular_velocity_noise_std_rps: [0.0, 0.0, 0.0]

  # ── Start / goal random generation ───────────────────────────────────
  start_goal:
    num_pairs_per_config: 3            # fewer pairs for quick test
    candidate_pair_multiplier: 2       # replace failed A* candidates when possible
    start_zone:
      x: [-8.0, 8.0]
      y: [-2.0, -1.0]
      z_min: 2.0
      z_max: 4.0
    goal_zone:
      x: [-8.0, 8.0]
      y: [31.0, 32.0]
      z_min: 2.0
      z_max: 4.0
    min_start_goal_distance: 15.0
    max_attempts: 200
    min_esdf_clearance_at_endpoints: 0.20

  # ── Trajectory planning & dynamics constraints ───────────────────────
  planning:
    # ═══════════════════════════════════════════════════════════════════
    #  Global path planner (A* on ESDF) — ONE call per start→goal pair
    # ═══════════════════════════════════════════════════════════════════
    global_planner:
      coarse_factor: 1                 # full resolution; min-pooling can close narrow corridors
      epsilon: 1.10                    # <=10% weighted-A* bound; avoids 800k-node failures
      max_iterations_coarse: 300000
      max_iterations_full: 800000       # 0.10 m grid has ~3.4x the 0.15 m voxel count
      max_planning_time_coarse_s: 8.0  # wall-clock guard for downsampled search
      max_planning_time_full_s: 45.0   # bounded guard sized for the 0.10 m grid
      cost_weight: 0.0                 # geometric shortest feasible path, no perimeter bias
      clearance_target: 0.25           # preserve tracking reserve around the global guide
      min_clearance: 0.15              # 0.20 m body radius + 0.15 m hard surface margin
      shortcut_enabled: true
      shortcut_check_spacing: 0.05
      reference_resample_spacing_m: 0.20

    # ═══════════════════════════════════════════════════════════════════
    #  Local receding-horizon planner (C++ pybind11 backend)
    # ═══════════════════════════════════════════════════════════════════
    local_planner:
      backend: "cpp_pybind"
      # auto uses NLopt/L-BFGS when libnlopt-cxx-dev is available at build
      # time, otherwise the time-bounded native optimizer is used.
      optimizer: "auto"

      planner_hz: 30.0
      horizon_time: 2.5
      execute_prefix_time: 0.60          # legacy field; position prefixes are no longer replayed
      velocity_command_lookahead_time: 0.08  # shorter preview reduces corner cutting
      velocity_tracking_gain: 2.0        # [1/s] feedback toward the collision-checked local path
      yaw_tracking_gain: 3.0             # [1/s] align nose to commanded velocity
      yaw_speed_threshold: 0.10          # [m/s] hold yaw below this horizontal speed
      max_plan_age: 0.75                 # measured from request state, never completion time
      planning_time_budget_ms: 40.0

      lookahead_distance: 4.0
      min_lookahead_distance: 2.0
      max_lookahead_distance: 6.0
      lookahead_velocity_gain: 0.6
      curvature_lookahead_gain: 1.0
      local_map_radius: 6.0              # fixed-radius ESDF query/optimization window
      max_reference_points: 32           # fixed upper bound for local guide complexity

      control_points: 12
      max_iterations: 200
      convergence_tolerance: 1.0e-4
      initial_step_size: 0.1
      minimum_step_size: 1.0e-4
      max_cost_samples_per_segment: 64   # bounds every objective evaluation

      min_clearance: 0.15
      target_clearance: 0.25
      collision_check_spacing: 0.05

      weight_smooth: 1.0
      weight_jerk: 0.2
      weight_guide: 0.8
      weight_obstacle: 4.0
      weight_goal: 2.0
      weight_dynamics: 1.0

      nominal_speed: 1.8
      max_velocity: 2.5
      max_acceleration: 3.5
      max_jerk: 15.0
      max_yaw_rate: 2.0

      goal_tolerance: 0.30
      goal_speed_tolerance: 0.20
      goal_hold_ticks: 3

      max_consecutive_failures: 6
      failure_grace_time: 1.0            # effective limit also scales with planner_hz
      reduce_lookahead_on_failure: true
      emergency_hold_enabled: true

      # ── Phase 2: observed ESDF usage ──
      use_observed_esdf: false
      forbid_unknown_space: false
      allow_global_map_fallback: false

    # ═══════════════════════════════════════════════════════════════════
    #  Validation thresholds for committed data
    # ═══════════════════════════════════════════════════════════════════
    validation:
      require_zero_collision: true
      require_zero_clearance_violations: true
      minimum_rows: 10
      maximum_none_depth_ratio: 0.20

    # ── DEPRECATED (kept for backward compat; NOT used by new pipeline) ──
    # esdf_optimize, pos_smooth_window, resample_spacing, time_param,
    # control_lookahead, control_yaw_smooth — these have been superseded
    # by the local planner.  They remain in the file only so old config
    # loaders do not crash; il_config.py will emit deprecation warnings.

  # ── Data format ──────────────────────────────────────────────────────
  data:
    coordinate_frame: "CAMERA_FLU"
    schema_version: 10
    collection_mode: "deterministic_lockstep"
    image_write_queue_size: 16
    label_lookahead_time_s: 0.08
    trend_horizontal_bins: 11
    trend_vertical_bins: 7
    trend_soft_sigma_bins: 0.75

  # ── Observed local occupancy map (Phase 2) ───────────────────────────
  observed_map:
    enabled: false

    resolution: 0.10

    size_x_m: 12.0
    size_y_m: 12.0
    size_z_m: 5.0

    history_seconds: 4.0

    occupied_endpoint_margin_m: 0.05

    unknown_is_free: false

    min_known_free_ratio: 0.95

    esdf_max_distance_m: 5.0

    rebuild_every_n_frames: 1

    depth_integration_step: 8

    # Free-space ray sampling spacing (metres).  Coarser than voxel
    # resolution to keep the Python ray-casting loop performant.
    free_space_sample_spacing_m: 0.50

  # ── Guide selector (Phase 2) ─────────────────────────────────────────
  guide_selector:
    max_range_m: 5.0

    horizontal_fov_margin_deg: 3.0
    vertical_fov_margin_deg: 3.0

    depth_visibility_tolerance_m: 0.20

    corridor_radius_m: 0.35
    corridor_sample_spacing_m: 0.10

    min_clearance_m: 0.35

    path_search_max_points: 200

    terminal_horizon_s: 1.5
    terminal_acceleration_limit_mps2: 3.0
    terminal_min_distance_m: 0.40

    use_depth_projection_visibility: true
    use_known_free_corridor: false

  # ── Sync & commit thresholds ─────────────────────────────────────────
  sync:
    max_acceptable_sync_error_ms: 100.0   # reject trajectory if any frame exceeds this
    max_acceptable_latency_ms:    250.0   # render RTT; frame_id exact matches remain synchronized
    max_latency_violation_pct:      1.0   # reject sustained latency, not one isolated spike
    catastrophic_latency_ms:     5000.0   # always reject a multi-second render backlog
    max_inflight_frames:              4   # bounded pose/render pipeline, prevents unbounded Unity backlog
    unity_response_timeout_s:       2.0   # abort/reject trajectory if pending frames receive no valid reply
    max_unmatched_pct:              1.0   # tolerate a few startup/reset replies
    max_none_depth_pct:             20.0  # max % of frames with missing depth

  commit:
    strict_collision_policy: true          # reject trajectory on ANY collision
    atomic_rename:           true          # use .inprogress → rename commit

# ── Scene definitions ────────────────────────────────────────────────────────
scenes:
  # ── 1. Small only – very sparse ──────────────────────────────────────────
  - name: "small_only"
    target_occupancy: 0.03               # challenging but leaves repeatable local corridors
    radius_min: 0.15
    radius_max: 1.0
    obstacle_count_min: 8
    obstacle_count_max: 14
    seeds: [100]

  # ── 2. Small + Medium – moderate ─────────────────────────────────────────
  - name: "small_medium"
    target_occupancy: 0.04               # avoid the previous 36-obstacle overload
    radius_min: 0.15
    radius_max: 2.5
    obstacle_count_min: 10
    obstacle_count_max: 18
    seeds: [400]

  # ── 3. Full range – slightly denser ──────────────────────────────────────
  - name: "large_medium_small"
    target_occupancy: 0.05               # dense evaluation scene without saturating A*
    radius_min: 0.15
    radius_max: 4.0
    obstacle_count_min: 12
    obstacle_count_max: 20
    seeds: [700]
